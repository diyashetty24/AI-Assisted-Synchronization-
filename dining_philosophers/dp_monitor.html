<style>

  .box b { display: block; font-size: 15px; }
  .table { position: relative; height: 380px; }

  .vars span { display: inline-block; background: #e3e8ff; padding: 3px 10px; margin: 10px 8px 0 0; border-radius: 6px; }
  #log { height: 220px; overflow: auto; background: #111; color: #ccc; padding: 8px; border-radius: 8px; font: 12px monospace; }
  #log .latest { color: #7cfc9a; }
  .legend { font-size: 12px; color: #555; margin-top: 8px; }

": "state", "message": "P3 is now thinking", "actor": "P3", "state": "thinking"}, {"time": 2.084, "kind": "state", "message": "P3 is now thinking", "actor": "P3", "state": "thinking"}, {"time": 2.084, "kind": "chopstick", "message": "P2 picks up chopstick 2", "chopstick": 2, "owner": "P2"}, {"time": 2.084, "kind": "chopstick", "message": "P2 picks up chopstick 3", "chopstick": 3, "owner": "P2"}, {"time": 2.084, "kind": "state", "message": "P2 is now eating", "actor": "P2", "state": "eating"}, {"time": 2.149, "kind": "state", "message": "P1 is now hungry", "actor": "P1", "state": "hungry"}, {"time": 2.36, "kind": "state", "message": "P3 is now hungry", "actor": "P3", "state": "hungry"}, {"time": 2.421, "kind": "chopstick", "message": "P2 puts down chopstick 2", "chopstick": 2, "owner": null}, {"time": 2.421, "kind": "chopstick", "message": "P2 puts down chopstick 3", "chopstick": 3, "owner": null}, {"time": 2.421, "kind": "state", "message": "P2 is now thinking", "actor": "P2", "state": "thinking"}, {"time": 2.421, "kind": "state", "message": "P2 finished all meals", "actor": "P2", "state": "done"}, {"time": 2.421, "kind": "chopstick", "message": "P1 picks up chopstick 1", "chopstick": 1, "owner": "P1"}, {"time": 2.421, "kind": "chopstick", "message": "P1 picks up chopstick 2", "chopstick": 2, "owner": "P1"}, {"time": 2.421, "kind": "state", "message": "P1 is now eating", "actor": "P1", "state": "eating"}, {"time": 2.422, "kind": "chopstick", "message": "P3 picks up chopstick 3", "chopstick": 3, "owner": "P3"}, {"time": 2.422, "kind": "chopstick", "message": "P3 picks up chopstick 0", "chopstick": 0, "owner": "P3"}, {"time": 2.422, "kind": "state", "message": "P3 is now eating", "actor": "P3", "state": "eating"}, {"time": 2.682, "kind": "chopstick", "message": "P1 puts down chopstick 1", "chopstick": 1, "owner": null}, {"time": 2.682, "kind": "chopstick", "message": "P1 puts down chopstick 2", "chopstick": 2, "owner": null}, {"time": 2.682, "kind": "state", "message" // Box colour for each state.
var colours = {
  idle: "#e5e7eb", thinking: "#e5e7eb", waiting: "#fde68a", hungry: "#fde68a",
  reading: "#93c5fd", writing: "#fca5a5", eating: "#86efac", done: "#d1d5db"
};

var current = -1;     // index of the last event shown (-1 = nothing yet)
var timer = null;     // set while the replay is playing

function $(id) { return document.getElementById(id); }
$("slider").max = data.events.length;

// Replay events 0..upTo from the beginning to find out what things look like.
function stateAt(upTo) {
  var states = {}, chopsticks = {}, vars = {};
  data.actors.forEach(function (a) { states[a] = "idle"; });
  data.chopsticks.forEach(function (f) { chopsticks[f] = null; });

  for (var i = 0; i <= upTo; i++) {
    var e = data.events[i];
    if (e.kind === "state") states[e.actor] = e.state;
    if (e.kind === "chopstick") chopsticks[e.chopstick] = e.owner;
    if (e.kind === "var") vars[e.name] = e.value;
  }
  return { states: states, chopsticks: chopsticks, vars: vars };
}

function box(title, text, colour, extraStyle) {
  return '<div class="box" style="background:' + colour + ';' + (extraStyle || '') + '">' +
         '<b>' + title + '</b>' + text + '</div>';
}

function draw() {
  var s = stateAt(current);
  var n = data.actors.length;
  var html = "";

  if (data.circle) {
    // Philosophers around a table, chopsticks in between.
    html += '<div class="table">';
    data.actors.forEach(function (name, k) {
      var angle = 2 * Math.PI * k / n - Math.PI / 2;
      var pos = "left:" + (50 + 38 * Math.cos(angle)) + "%;top:" + (50 + 40 * Math.sin(angle)) + "%";
      html += box(name, s.states[name], colours[s.states[name]], pos);
    });
    data.chopsticks.forEach(function (f, k) {
      var angle = 2 * Math.PI * (k + 0.5) / n - Math.PI / 2;
      var pos = "left:" + (50 + 20 * Math.cos(angle)) + "%;top:" + (50 + 22 * Math.sin(angle)) +
                "%;min-width:64px;font-size:11px";
      var owner = s.chopsticks[f];
      html += box("Chopstick " + f, owner ? "held by " + owner : "free", owner ? "#fcd34d" : "white", pos);
    });
    html += "</div>";
  } else {
    html += '<div class="row">';
    data.actors.forEach(function (name) {
      html += box(name, s.states[name], colours[s.states[name]]);
    });
    html += "</div>";
  }

  html += '<div class="vars">';
  Object.keys(s.vars).forEach(function (k) {
    html += "<span>" + k + ": <b>" + s.vars[k] + "</b></span>";
  });
  html += "</div>";
  html += '<div class="legend">grey: idle/thinking, yellow: waiting/hungry, blue: reading, red: writing, green: eating</div>';
  $("stage").innerHTML = html;

  // Log: show up to the last 150 events.
  var log = "";
  for (var i = Math.max(0, current - 150); i <= current; i++) {
    var e = data.events[i];
    log += '<div class="' + (i === current ? "latest" : "") + '">[' + e.time.toFixed(3) + "s] " + e.message + "</div>";
  }
  $("log").innerHTML = log;
  $("log").scrollTop = $("log").scrollHeight;

  $("slider").value = current + 1;
  $("position").textContent = (current + 1) + " / " + data.events.length;
}

function nextStep() {
  if (current < data.events.length - 1) { current++; draw(); }
  else pause();
}

function play() {
  pause();
  if (current >= data.events.length - 1) current = -1;   // restart if finished
  timer = setInterval(nextStep, 500 / parseFloat($("speed").value));
}

function pause() {
  if (timer) { clearInterval(timer); timer = null; }
}

$("startBtn").onclick = play;
$("pauseBtn").onclick = pause;
$("resetBtn").onclick = function () { pause(); current = -1; draw(); };
$("speed").onchange = function () { if (timer) play(); };
$("slider").oninput = function (e) { pause(); current = parseInt(e.target.value) - 1; draw(); };

draw();
</script>
