<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Readers-Writers - Semaphores (readers-preference)</title>
<style>
  body { font-family: sans-serif; margin: 16px; background: #f4f5f7; }
  h1 { font-size: 20px; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  button, select { padding: 6px 12px; font-size: 14px; }
  #slider { flex: 1; min-width: 150px; }
  #stage { background: white; border: 1px solid #ccc; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .box { min-width: 84px; padding: 8px; border: 2px solid #777; border-radius: 8px; text-align: center; font-size: 13px; }
  .box b { display: block; font-size: 15px; }
  .table { position: relative; height: 380px; }
  .table .box { position: absolute; transform: translate(-50%, -50%); }
  .vars span { display: inline-block; background: #e3e8ff; padding: 3px 10px; margin: 10px 8px 0 0; border-radius: 6px; }
  #log { height: 220px; overflow: auto; background: #111; color: #ccc; padding: 8px; border-radius: 8px; font: 12px monospace; }
  #log .latest { color: #7cfc9a; }
  .legend { font-size: 12px; color: #555; margin-top: 8px; }
</style>
</head>
<body>
<h1>Readers-Writers - Semaphores (readers-preference)</h1>

<div class="controls">
  <button id="startBtn">Start</button>
  <button id="pauseBtn">Pause</button>
  <button id="resetBtn">Reset</button>
  <select id="speed">
    <option value="0.5">0.5x</option>
    <option value="1" selected>1x</option>
    <option value="2">2x</option>
    <option value="4">4x</option>
  </select>
  <input type="range" id="slider" min="0" value="0">
  <span id="position"></span>
</div>

<div id="stage"></div>
<div id="log"></div>

<script>
// All events recorded by the Python program.

"R1 reads value 2", "actor": "R1", "state": "reading"}, {"time": 1.31, "kind": "var", "message": "active readers = 3", "name": "active readers", "value": 3}, {"time": 1.31, "kind": "state", "message": "R2 reads value 2", "actor": "R2", "state": "reading"}, {"time": 1.31, "kind": "var", "message": "active readers = 4", "name": "active readers", "value": 4}, {"time": 1.334, "kind": "state", "message": "W1 is now waiting", "actor": "W1", "state": "waiting"}, {"time": 1.511, "kind": "state", "message": "W2 is now waiting", "actor": "W2", "state": "waiting"}, {"time": 1.551, "kind": "state", "message": "R4 finished reading", "actor": "R4", "state": "idle"}, {"time": 1.552, "kind": "var", "message": "active readers = 3", "name": "active readers", "value": 3}, {"time": 1.616, "kind": "state", "message": "R2 finished reading", "actor": "R2", "state": "idle"}, {"time": 1.616, "kind": "var", "message": "active readers = 2", "name": "active readers", "value": 2}, {"time": 1.672, "kind": "state", "message": "R3 finished reading", "actor": "R3", "state": "idle"}, {"time": 1.672, "kind": "var", "message": "active readers = 1", "name": "active readers", "value": 1}, {"time": 1.684, "kind": "state", "message": "R1 finished reading", "actor": "R1", "state": "idle"}, {"time": 1.684, "kind": "var", "message": "active readers = 0", "name": "active readers", "value": 0}, {"time": 1.685, "kind": "state", "message": "W1 is writing", "actor": "W1", "state": "writing"}, {"time": 1.754, "kind": "state", "message": "R4 is now waiting", "actor": "R4", "state": "waiting"}, {"time": 1.841, "kind": "var", "message": "value = 3", "name": "value", "value": 3}, {"time": 1.841, "kind": "state", "message": "W1 finished writing", "actor": "W1", "state": "idle"}, {"time": 1.841, "kind": "state", "message": "W2 is writing", "actor": "W2", "state": "writing"}, {"time": 1.953, "kind": "state", "message": "R2 is now waiting", "actor": "R2", "state": "waiting"}, {"time": 2.025, "kind": "state", "message": "R1 is now waiting", "actor": "R1", "state": "waiting"}, {"time": 2.083, "kind": "state", "message": "R3 is now waiting", "actor": "R3", "state": "waiting"}, {"time": 2.253, "kind": "state", "message": "W1 is now waiting", "actor": "W1", "state": "waiting"}, {"time": 2.265, "kind": "var", "message": "value = 4", "name": "value", "value": 4}, {"time": 2.266, "kind": "state", "message": "W2 finished writing", "actor": "W2", "state": "idle"}, {"time": 2.266, "kind": "state", "message": "R4 reads value 4", "actor": "R4", "state": "reading"}, {"time": 2.267, "kind": "var", "message": "active readers = 1", "name": "active readers", "value": 1}, {"time": 2.267, "kind": "state", "message": "R2 reads value 4", "actor": "R2", "state": "reading"}, {"time": 2.267, "kind": "var", "message": "active readers = 2", "name": "active readers", "value": 2}, {"time": 2.267, "kind": "state", "message": "R1 reads value 4", "actor": "R1", "state": "reading"}, {"time": 2.267, "kind": "var", "message": "active readers = 3", "name": "active readers", "value": 3}, {"time": 2.268, "kind": "state", "message": "R3 reads value 4", "actor": "R3", "state": "reading"}, {"time": 2.268, "kind": "var", "message": "active readers = 4", "name": "active readers", "value": 4}, {"time": 2.454, "kind": "state", "message": "W2 is now waiting", "actor": "W2", "state": "waiting"}, {"time": 2.522, "kind": "state", "message": "R3 finished reading", "actor": "R3", "state": "idle"}, {"time": 2.522, "kind": "var", "message": "active readers = 3", "name": "active readers", "value": 3}, {"time": 2.524, "kind": "state", "message": "R4 finished reading", "actor": "R4", "state": "idle"}, {"time": 2.524, "kind": "var", "message": "active readers = 2", "name": "active readers", "value": 2}, {"time": 2.638, "kind": "state", "message": "R1 finished reading", "actor": "R1", "state": "idle"}, {"time": 2.638, "kind": "var", "message": "active readers = 1", "name": "active readers", "value": 1}, {"time": 2.644, "kind": "state", "message": "R2 finished reading", "actor": "R2", "state": "idle"}, {"time": 2.644, "kind": "var", "message": "active readers = 0", "name": "active readers", "value": 0}, {"time": 2.645, "kind": "state", "message": "W1 is writing", "actor": "W1", "state": "writing"}, {"time": 3.052, "kind": "var", "message": "value = 5", "name": "value", "value": 5}, {"time": 3.052, "kind": "state", "message": "W1 finished writing", "actor": "W1", "state": "idle"}, {"time": 3.052, "kind": "state", "message": "W2 is writing", "actor": "W2", "state": "writing"}, {"time": 3.272, "kind": "var", "message": "value = 6", "name": "value", "value": 6}, {"time": 3.272, "kind": "state", "message": "W2 finished writing", "actor": "W2", "state": "idle"}]};

// Box colour for each state.
var colours = {
  idle: "#e5e7eb", thinking: "#e5e7eb", waiting: "#fde68a", hungry: "#fde68a",
  reading: "#93c5fd", writing: "#fca5a5", eating: "#86efac", done: "#d1d5db"
};

var current = -1;     // index of the last event shown (-1 = nothing yet)
var timer = null;     // set while the replay is playing

function $(id) { return document.getElementById(id); }
$("slider").max = data.events.length;

// Replay events 0..upTo from the beginning to find out what things look like.
function stateAt(upTo) {
  var states = {}, chopsticks = {}, vars = {};
  data.actors.forEach(function (a) { states[a] = "idle"; });
  data.chopsticks.forEach(function (f) { chopsticks[f] = null; });

  for (var i = 0; i <= upTo; i++) {
    var e = data.events[i];
    if (e.kind === "state") states[e.actor] = e.state;
    if (e.kind === "chopstick") chopsticks[e.chopstick] = e.owner;
    if (e.kind === "var") vars[e.name] = e.value;
  }
  return { states: states, chopsticks: chopsticks, vars: vars };
}

function box(title, text, colour, extraStyle) {
  return '<div class="box" style="background:' + colour + ';' + (extraStyle || '') + '">' +
         '<b>' + title + '</b>' + text + '</div>';
}

function draw() {
  var s = stateAt(current);
  var n = data.actors.length;
  var html = "";

  if (data.circle) {
    // Philosophers around a table, chopsticks in between.
    html += '<div class="table">';
    data.actors.forEach(function (name, k) {
      var angle = 2 * Math.PI * k / n - Math.PI / 2;
      var pos = "left:" + (50 + 38 * Math.cos(angle)) + "%;top:" + (50 + 40 * Math.sin(angle)) + "%";
      html += box(name, s.states[name], colours[s.states[name]], pos);
    });
    data.chopsticks.forEach(function (f, k) {
      var angle = 2 * Math.PI * (k + 0.5) / n - Math.PI / 2;
      var pos = "left:" + (50 + 20 * Math.cos(angle)) + "%;top:" + (50 + 22 * Math.sin(angle)) +
                "%;min-width:64px;font-size:11px";
      var owner = s.chopsticks[f];
      html += box("Chopstick " + f, owner ? "held by " + owner : "free", owner ? "#fcd34d" : "white", pos);
    });
    html += "</div>";
  } else {
    html += '<div class="row">';
    data.actors.forEach(function (name) {
      html += box(name, s.states[name], colours[s.states[name]]);
    });
    html += "</div>";
  }

  html += '<div class="vars">';
  Object.keys(s.vars).forEach(function (k) {
    html += "<span>" + k + ": <b>" + s.vars[k] + "</b></span>";
  });
  html += "</div>";
  html += '<div class="legend">grey: idle/thinking, yellow: waiting/hungry, blue: reading, red: writing, green: eating</div>';
  $("stage").innerHTML = html;

  // Log: show up to the last 150 events.
  var log = "";
  for (var i = Math.max(0, current - 150); i <= current; i++) {
    var e = data.events[i];
    log += '<div class="' + (i === current ? "latest" : "") + '">[' + e.time.toFixed(3) + "s] " + e.message + "</div>";
  }
  $("log").innerHTML = log;
  $("log").scrollTop = $("log").scrollHeight;

  $("slider").value = current + 1;
  $("position").textContent = (current + 1) + " / " + data.events.length;
}

function nextStep() {
  if (current < data.events.length - 1) { current++; draw(); }
  else pause();
}

function play() {
  pause();
  if (current >= data.events.length - 1) current = -1;   // restart if finished
  timer = setInterval(nextStep, 500 / parseFloat($("speed").value));
}

function pause() {
  if (timer) { clearInterval(timer); timer = null; }
}

$("startBtn").onclick = play;
$("pauseBtn").onclick = pause;
$("resetBtn").onclick = function () { pause(); current = -1; draw(); };
$("speed").onchange = function () { if (timer) play(); };
$("slider").oninput = function (e) { pause(); current = parseInt(e.target.value) - 1; draw(); };

draw();
</script>
</body>
</html>
